name: Auto Format Code

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  format:
    runs-on: ubuntu-latest
    # Prevent infinite loops if the action pushes changes
    if: github.actor != 'github-actions[bot]'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # Crucial for letting the action push changes back to the repo
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: ${{ github.head_ref || github.ref }}

    - name: Install clang-format
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format

    - name: Format C/C++ files (Allman Style)
      run: |
        # Find all matching files and format them inline using Allman style fallback
        find . -type f \( -name "*.c" -o -name "*.cpp" -o -name "*.h" -o -name "*.hh" \) \
        -not -path '*/.*' \
        -exec clang-format -i -style="{BasedOnStyle: llvm, BreakBeforeBraces: Allman}" {} +

    - name: Commit and Push changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore: auto-format C/C++ code (Allman style)"
        file_pattern: '*.c *.cpp *.h *.hh'
