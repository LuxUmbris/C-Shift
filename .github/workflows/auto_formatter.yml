name: Scheduled C/C++ Auto Format

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-cpp:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull the repository
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: main

    # 2. Setup clang-format
    - name: Install clang-format
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format

    # 3. Clean up formatting roadblocks explicitly
    - name: Purge Ghost Spaces & Normalize Line Endings
      run: |
        # Strip exact non-breaking space bytes (both UTF-8 variations)
        find . -type f \( -name "*.cpp" -o -name "*.c" -o -name "*.h" -o -name "*.hh" \) -exec sed -i 's/\x20\xa0/  /g' {} +
        find . -type f \( -name "*.cpp" -o -name "*.c" -o -name "*.h" -o -name "*.hh" \) -exec sed -i 's/\xc2\xa0/ /g' {} +
        
        # Strip Windows carriage returns to prevent ghost commits
        find . -type f \( -name "*.cpp" -o -name "*.c" -o -name "*.h" -o -name "*.hh" \) -exec sed -i 's/\r//g' {} +

    # 4. Enforce format via local configuration
    - name: Run clang-format (Explicit Style)
      run: |
        # --style=file forces it to look for your root .clang-format rules
        find . -type f \( -name "*.cpp" -o -name "*.c" -o -name "*.h" -o -name "*.hh" \) -exec clang-format -style=file -i {} +

    # 5. Push changes
    - name: Commit and Push Clean Code
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore: forced C/C++ Allman formatting cleanup"
        commit_user_name: "github-actions[bot]"
        commit_user_email: "github-actions[bot]@users.noreply.github.com"
