name: Auto Format Code

on:
  # Run on pushes to main only — not on every branch, not on a timer.
  # A cron job that rewrites main every 30 min causes merge conflicts
  # on feature branches and burns unnecessary CI minutes.
  push:
    branches:
      - main
    paths:
      # Only trigger when C/C++ source changes
      - "**.c"
      - "**.cpp"
      - "**.h"
      - "**.hh"
  workflow_dispatch:

jobs:
  format:
    name: Clang-format
    runs-on: ubuntu-latest

    # Only run on the main branch (workflow_dispatch can be triggered from any
    # branch, so guard explicitly).
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Fetch full history so the commit has proper ancestry
          fetch-depth: 0

      - name: Install clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format

      - name: Create .clang-format config
        run: |
          cat > .clang-format << 'EOF'
          BasedOnStyle: LLVM
          BreakBeforeBraces: Allman
          AllowShortBlocksOnASingleLine: false
          AllowShortIfStatementsOnASingleLine: false
          ColumnLimit: 100
          IndentWidth: 2
          EOF

      - name: Format C/C++ files
        run: |
          # Exclude vendored/generated files
          find . -type f \( -name "*.c" -o -name "*.cpp" -o -name "*.h" -o -name "*.hh" \) \
            -not -path '*/.*' \
            -not -path '*/node_modules/*' \
            -not -path '*/build/*' \
            -not -path '*/dist/*' \
            -not -name 'ezllvm.h' \
            -exec clang-format -i -style=file {} +

      - name: Remove temporary config
        run: rm -f .clang-format

      - name: Commit formatting changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-format C/C++ code (Allman style)"
          branch: main
          # Don't commit if nothing changed (avoids empty commits)
          skip_dirty_check: false
