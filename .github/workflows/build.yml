name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            artifact: cshift-linux
            binary: build/cshift

          - os: macos-latest
            name: macOS
            artifact: cshift-macos
            binary: build/cshift

          - os: windows-latest
            name: Windows
            artifact: cshift-windows
            binary: build/Release/cshift.exe

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      # ── Linux: LLVM + lld via apt ──────────────────────────────────────────
      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev lld

      # ── macOS: LLVM via Homebrew ───────────────────────────────────────────
      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH
          echo "LLVM_DIR=$(brew --prefix llvm)/lib/cmake/llvm" >> $GITHUB_ENV

      # ── Windows: LLVM vom offiziellen GitHub Release ──────────────────────
      # choco installiert nur Binaries, keine CMake-Dev-Files (LLVMConfig.cmake).
      # Das offizielle LLVM-Windows-Installer-EXE enthält alles inkl. cmake/.
      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "18.1.8"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/LLVM-$version-win64.exe"
          $installer = "$env:TEMP\llvm-installer.exe"
          Write-Host "Downloading LLVM $version..."
          Invoke-WebRequest -Uri $url -OutFile $installer
          Write-Host "Installing..."
          Start-Process -FilePath $installer -ArgumentList "/S" -Wait
          $llvm = "C:\Program Files\LLVM"
          echo "LLVM_DIR=$llvm\lib\cmake\llvm" >> $env:GITHUB_ENV
          echo "$llvm\bin"                     >> $env:GITHUB_PATH

      # ── Configure ─────────────────────────────────────────────────────────
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_PREFIX_PATH="$(brew --prefix llvm)"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -DLLVM_DIR="$env:LLVM_DIR"

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build
        run: cmake --build build --config Release

      # ── Upload ────────────────────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
