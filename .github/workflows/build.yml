name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            artifact: cshift-linux

          - os: macos-latest
            name: macOS
            artifact: cshift-macos

          - os: windows-latest
            name: Windows
            artifact: cshift-windows

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      # ── Linux ──────────────────────────────────────────────────────────────
      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev lld

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build \
            -DCMAKE_INSTALL_PREFIX=dist

      # ── macOS ──────────────────────────────────────────────────────────────
      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build \
            -DCMAKE_PREFIX_PATH="$(brew --prefix llvm)" \
            -DCMAKE_INSTALL_PREFIX=dist

      # ── Windows (MSVC + Ninja) ─────────────────────────────────────────────
      - name: Find LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $found = Get-ChildItem "C:\" -Recurse -Filter "LLVMConfig.cmake" -ErrorAction SilentlyContinue |
                   Select-Object -First 1
          if (-not $found) { Write-Error "LLVMConfig.cmake not found"; exit 1 }
          $llvmDir = $found.DirectoryName
          Write-Host "Found LLVM at: $llvmDir"
          echo "LLVM_DIR=$llvmDir" >> $env:GITHUB_ENV

      - name: Configure (Windows, MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DLLVM_DIR="$env:LLVM_DIR" `
            -DCMAKE_INSTALL_PREFIX=dist `
            -G "Ninja"

      # ── Build + Install ────────────────────────────────────────────────────
      - name: Build
        run: cmake --build build --config Release

      - name: Install into dist/
        run: cmake --install build --config Release

      # ── Write install script (Linux/macOS) ────────────────────────────────
      - name: Write install script (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cat > dist/install.sh << 'SCRIPT'
          #!/usr/bin/env bash
          set -e
          INSTALL_DIR="${1:-/usr/local}"
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"

          echo "Installing C<< to $INSTALL_DIR ..."
          cp -r "$SCRIPT_DIR/bin" "$INSTALL_DIR/"
          cp -r "$SCRIPT_DIR/share" "$INSTALL_DIR/"

          CSHIFT_STD="$INSTALL_DIR/share/cshift"

          if   [ -f "$HOME/.zshrc"  ]; then RC="$HOME/.zshrc"
          elif [ -f "$HOME/.bashrc" ]; then RC="$HOME/.bashrc"
          else RC="$HOME/.profile"
          fi

          sed -i.bak '/# cshift/d; /CSHIFT_STD/d; /cshift\/bin/d' "$RC" 2>/dev/null || true

          cat >> "$RC" << ENV
          # cshift
          export CSHIFT_STD="$CSHIFT_STD"
          export PATH="\$PATH:$INSTALL_DIR/bin"
          ENV

          echo "Done. Restart your shell or run: source $RC"
          SCRIPT
          chmod +x dist/install.sh

      # ── Write install script (Windows) ────────────────────────────────────
      - name: Write install script (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $script = @'
          param([string]$InstallDir = "$env:LOCALAPPDATA\cshift")
          $ScriptDir = Split-Path -Parent $MyInvocation.MyCommand.Path

          Write-Host "Installing C<< to $InstallDir ..."
          New-Item -ItemType Directory -Force -Path $InstallDir | Out-Null
          Copy-Item -Recurse -Force "$ScriptDir\bin\*"   "$InstallDir\bin\"   -ErrorAction SilentlyContinue
          Copy-Item -Recurse -Force "$ScriptDir\share\*" "$InstallDir\share\" -ErrorAction SilentlyContinue

          $stdPath = "$InstallDir\share\cshift"
          $binPath = "$InstallDir\bin"

          $target = if ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()`
                        .IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
              "Machine"
          } else {
              "User"
          }

          [Environment]::SetEnvironmentVariable("CSHIFT_STD", $stdPath, $target)

          $currentPath = [Environment]::GetEnvironmentVariable("PATH", $target)
          if ($currentPath -notlike "*$binPath*") {
              [Environment]::SetEnvironmentVariable("PATH", "$currentPath;$binPath", $target)
          }

          Write-Host "Done! Restart your terminal."
          '@
          $script | Out-File -Encoding UTF8 dist\install.ps1

      # ── Upload artifact ────────────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
