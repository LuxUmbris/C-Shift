name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM + MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            llvm-dev clang lld \
            mingw-w64 \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64

      # ───────────────────────────────────────────────
      # Linux native build
      # ───────────────────────────────────────────────
      - name: Configure (Linux)
        run: cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release

      - name: Build (Linux)
        run: cmake --build build-linux --config Release

      - name: Install (Linux)
        run: cmake --install build-linux --prefix dist-linux

      # ───────────────────────────────────────────────
      # Windows cross‑compile
      # ───────────────────────────────────────────────
      - name: Configure (Windows cross)
        run: |
          cmake -S . -B build-win \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build (Windows cross)
        run: cmake --build build-win --config Release

      - name: Install (Windows cross)
        run: cmake --install build-win --prefix dist-windows

      # ───────────────────────────────────────────────
      # Upload artifacts
      # ───────────────────────────────────────────────
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: cshift-linux
          path: dist-linux/

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: cshift-windows
          path: dist-windows/

  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Configure (macOS)
        run: cmake -S . -B build-macos \
          -DCMAKE_PREFIX_PATH="$(brew --prefix llvm)" \
          -DCMAKE_BUILD_TYPE=Release

      - name: Build (macOS)
        run: cmake --build build-macos --config Release

      - name: Install (macOS)
        run: cmake --install build-macos --prefix dist-macos

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: cshift-macos
          path: dist-macos/
