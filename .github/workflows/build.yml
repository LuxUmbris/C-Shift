name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            artifact: cshift-linux
            binary: build/cshift

          - os: macos-latest
            name: macOS
            artifact: cshift-macos
            binary: build/cshift

          - os: windows-latest
            name: Windows
            artifact: cshift-windows
            binary: build/Release/cshift.exe

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      # ── Linux ──────────────────────────────────────────────────────────────
      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev lld

      # ── macOS ──────────────────────────────────────────────────────────────
      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      # ── Windows: find LLVMConfig.cmake (GHCup ships one) ──────────────────
      - name: Find LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $found = Get-ChildItem "C:\" -Recurse -Filter "LLVMConfig.cmake" -ErrorAction SilentlyContinue |
                   Select-Object -First 1
          if (-not $found) { Write-Error "LLVMConfig.cmake not found"; exit 1 }
          $llvmDir = $found.DirectoryName
          Write-Host "Found LLVM at: $llvmDir"
          echo "LLVM_DIR=$llvmDir" >> $env:GITHUB_ENV

      # ── Configure ──────────────────────────────────────────────────────────
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_PREFIX_PATH="$(brew --prefix llvm)"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -DLLVM_DIR="$env:LLVM_DIR" -G "MinGW Makefiles"

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build
        run: cmake --build build --config Release

      # ── Upload ─────────────────────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
